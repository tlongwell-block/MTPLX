<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Frankie · MTPLX</title>
  <style>
    :root {
      color-scheme: dark;
      font: 16px/1.5 system-ui;
      background: #0c1118;
      color: #e1e8ef;
    }
    body {
      max-width: 920px;
      margin: auto;
      padding: 32px 22px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 {
      font-size: 30px;
      letter-spacing: -1px;
      margin: 0;
    }
    small,
    .muted {
      color: #98a9ba;
    }
    a {
      color: #8acbff;
    }
    .panel {
      background: #151e29;
      border: 1px solid #2b3b4b;
      border-radius: 16px;
      padding: 20px;
      margin: 18px 0;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    button,
    select,
    textarea,
    input {
      font: inherit;
      border-radius: 9px;
      border: 1px solid #3e5165;
      color: inherit;
      background: #1b2a39;
      padding: 9px 14px;
    }
    button {
      cursor: pointer;
    }
    button.primary {
      background: #84d9ba;
      color: #091e19;
      font-weight: 650;
      border: 0;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
      margin-bottom: 10px;
      background: #101923;
    }
    label {
      display: flex;
      gap: 7px;
      align-items: center;
    }
    #status {
      color: #84d9ba;
    }
    #log {
      min-height: 220px;
      max-height: 55vh;
      overflow: auto;
    }
    .message {
      white-space: pre-wrap;
      padding: 12px 0;
      border-bottom: 1px solid #2b3b4b;
    }
    .message.user {
      color: #a7bfd2;
    }
    .message strong {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #89a3ba;
    }
    details {
      margin-top: 15px;
    }
    input[type="file"] {
      max-width: 100%;
      font-size: 13px;
    }
    #meter {
      height: 4px;
      background: #30424c;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 15px;
    }
    #level {
      height: 100%;
      background: #84d9ba;
      width: 0;
    }
    #stats {
      font-size: 12px;
      margin-top: 12px;
      color: #98a9ba;
    }
  </style>
  <header>
    <div>
      <h1>Frankie</h1>
      <small>Live voice, text and images</small>
    </div>
    <a
      href="https://github.com/youssofal/MTPLX"
      target="_blank"
      rel="noreferrer"
      >Powered by MTPLX</a
    >
  </header>
  <section class="panel">
    <div class="controls">
      <button class="primary" id="start">Start conversation</button
      ><button id="stop" disabled>End</button
      ><button id="interrupt" disabled>Interrupt</button
      ><span id="status">Ready to connect</span>
    </div>
    <div id="meter"><div id="level"></div></div>
    <details>
      <summary>Conversation settings</summary>
      <div class="controls" style="margin: 12px 0">
        <label
          >Thinking
          <select id="thinking">
            <option value="off">Off</option>
            <option>minimal</option>
            <option>low</option>
            <option>medium</option>
            <option>high</option>
          </select></label
        ><label
          ><input type="checkbox" id="speak" checked />Speak responses</label
        >
      </div>
      <label
        >Voice reference
        <input id="voice" type="file" accept="audio/wav" /></label
      ><input
        id="voiceText"
        placeholder="Reference transcript (optional)"
        style="width: 90%; margin-top: 10px"
      /><button id="setVoice" style="margin-top: 10px">Use this voice</button>
      <p class="muted">
        Your microphone stays active while Frankie speaks. You can interrupt
        naturally.
      </p>
    </details>
    <div id="stats"></div>
  </section>
  <section class="panel"><div id="log" aria-live="polite"></div></section>
  <section class="panel">
    <textarea
      id="text"
      rows="2"
      placeholder="Type a message, or attach an image…"
    ></textarea>
    <div class="controls">
      <button id="send" disabled>Send</button
      ><input type="file" id="image" accept="image/*" />
    </div>
  </section>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    let ws,
      ctx,
      node,
      tracks,
      current,
      ready = false,
      active = false,
      pendingText = false;
    const messages = new Map(),
      evidence = [];
    let lastPlayback = null;
    window.frankieTest = { evidence, send: (event) => send(event) };
    function record(type, data = {}) {
      evidence.push({ time: performance.now(), type, ...data });
      if (evidence.length > 20000) evidence.shift();
    }
    function send(event) {
      if (ws?.readyState === 1) ws.send(JSON.stringify(event));
    }
    function status(text) {
      $("status").textContent = text;
    }
    function base64(pcm) {
      let s = "";
      for (const n of new Uint8Array(
        pcm.buffer,
        pcm.byteOffset,
        pcm.byteLength,
      ))
        s += String.fromCharCode(n);
      return btoa(s);
    }
    function message(id, role, text = "") {
      let row = messages.get(id);
      if (!row) {
        const div = document.createElement("div");
        div.className = "message " + role;
        const title = document.createElement("strong");
        title.textContent = role === "user" ? "You" : "Frankie";
        row = document.createElement("span");
        div.append(title, row);
        $("log").append(div);
        messages.set(id, row);
      }
      row.textContent = text;
      $("log").scrollTop = $("log").scrollHeight;
      return row;
    }
    function settings() {
      const thinking = $("thinking").value;
      send({
        type: "session.update",
        session: {
          thinking,
          max_output_tokens:
            512 +
            { off: 0, minimal: 64, low: 256, medium: 1024, high: 4096 }[
              thinking
            ],
          output_modalities: [$("speak").checked ? "audio" : "text"],
        },
      });
    }
    function clearPlayback() {
      node?.port.postMessage({ type: "clear", requestId: "interrupt" });
    }
    async function onEvent(e) {
      record(e.type, { response_id: e.response_id, item_id: e.item_id });
      if (e.type === "session.created") {
        settings();
        return;
      }
      if (e.type === "session.updated") {
        ready = true;
        node?.port.postMessage({ type: "capture", enabled: true });
        status("Listening");
        $("send").disabled = false;
        return;
      }
      if (e.type === "response.created") {
        active = true;
        current = e.response.id;
        status("Responding");
        return;
      }
      if (e.type === "conversation.item.created") {
        const i = e.item;
        if (i.type === "message") {
          const text = i.content
            .map(
              (p) =>
                p.text ||
                p.transcript ||
                (p.type === "input_audio"
                  ? "[Voice message]"
                  : p.type === "input_image"
                    ? "[Image]"
                    : ""),
            )
            .join("\n");
          message(i.id, i.role, text);
        }
        if (pendingText && i.role === "user") {
          pendingText = false;
          send({ type: "response.create" });
        }
        return;
      }
      if (
        e.type === "response.output_text.delta" ||
        e.type === "response.output_audio_transcript.delta"
      ) {
        const row = message(
          e.item_id,
          "assistant",
          messages.get(e.item_id)?.textContent || "",
        );
        row.textContent += e.delta;
        return;
      }
      if (e.type === "response.output_audio.done") {
        node.port.postMessage({ type: "done", itemId: e.item_id });
        return;
      }
      if (e.type === "response.output_audio.delta") {
        const b = Uint8Array.from(atob(e.delta), (c) => c.charCodeAt(0));
        const pcm = new Int16Array(b.buffer);
        record("audio_received", { itemId: e.item_id, samples: pcm.length });
        node.port.postMessage(
          { type: "audio", responseId: e.response_id, itemId: e.item_id, pcm },
          [pcm.buffer],
        );
        return;
      }
      if (e.type === "frankie.playback.clear") {
        clearPlayback();
        return;
      }
      if (e.type === "response.done") {
        active = false;
        status(
          e.response.status === "failed" ? "Response failed" : "Listening",
        );
        if (e.response.status === "failed")
          message(
            "error_" + Date.now(),
            "assistant",
            e.response.status_details.error.message,
          );
        return;
      }
      if (e.type === "frankie.metrics") {
        $("stats").textContent =
          `MTP ${e.metrics.speculative_depth || 0} · ${e.metrics.accepted_drafts || 0}/${e.metrics.drafted_tokens || 0} drafts accepted · ${Number(e.metrics.audio_seconds).toFixed(1)}s audio`;
        return;
      }
      if (e.type === "frankie.voice.updated") {
        status("Voice updated");
        return;
      }
      if (e.type === "error") {
        status(e.error.message);
        record("error", { message: e.error.message });
      }
    }
    async function start() {
      const token = location.hash.slice(1);
      if (!token) {
        status("Open the complete private launch URL.");
        return;
      }
      $("start").disabled = true;
      status("Connecting…");
      try {
        ctx = new AudioContext({ sampleRate: 24000 });
        await ctx.resume();
        await ctx.audioWorklet.addModule("/audio-worklet.mjs");
        node = new AudioWorkletNode(ctx, "duplex-audio", {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          outputChannelCount: [1],
        });
        node.connect(ctx.destination);
        node.port.onmessage = ({ data }) => {
          if (data.type === "capture" && ready) {
            if (ws.bufferedAmount > 24000 * 4) {
              status("Connection cannot keep up with live audio.");
              end();
              return;
            }
            send({
              type: "input_audio_buffer.append",
              audio: base64(data.pcm),
            });
            let peak = 0;
            for (const x of data.pcm) peak = Math.max(peak, Math.abs(x));
            $("level").style.width = Math.min(100, peak / 100) + "%";
            record("capture", { samples: data.pcm.length });
          } else if (data.type === "position") {
            lastPlayback = data.playback;
            record("playback", { ...data.playback });
          } else if (data.type === "stopped" && data.playback) {
            const p = data.playback;
            send({
              type: "conversation.item.truncate",
              item_id: p.itemId,
              content_index: 0,
              audio_end_ms: Math.floor(p.playedSamples / 24),
            });
            record("playback_stopped", p);
          } else if (data.type === "underrun") {
            record("underrun", { itemId: data.itemId });
          } else if (data.type === "error") {
            status(data.message);
            record("error", { message: data.message });
          }
        };
        tracks = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
        ctx.createMediaStreamSource(tracks).connect(node);
        ws = new WebSocket(
          (location.protocol === "https:" ? "wss://" : "ws://") +
            location.host +
            "/v1/realtime",
          ["realtime", "openai-insecure-api-key." + token],
        );
        const socket = ws;
        socket.onmessage = (e) => {
          if (ws === socket)
            onEvent(JSON.parse(e.data)).catch((e) => status(e.message));
        };
        socket.onclose = () => {
          if (ws !== socket) return;
          status("Disconnected");
          end();
        };
        socket.onerror = () => {
          if (ws === socket) status("Connection failed");
        };
        $("stop").disabled = false;
        $("interrupt").disabled = false;
      } catch (e) {
        status(e.message);
        await end();
      }
    }
    async function end() {
      ready = false;
      active = false;
      pendingText = false;
      current = null;
      tracks?.getTracks().forEach((t) => t.stop());
      tracks = null;
      node?.port.postMessage({ type: "capture", enabled: false });
      if (node) node.port.onmessage = null;
      node = null;
      const socket = ws;
      ws = null;
      socket?.close();
      const audioContext = ctx;
      ctx = null;
      await audioContext?.close().catch(() => {});
      $("start").disabled = false;
      $("stop").disabled = true;
      $("interrupt").disabled = true;
      $("send").disabled = true;
      record("ended");
    }
    $("start").onclick = start;
    $("stop").onclick = end;
    $("interrupt").onclick = () => {
      send({ type: "response.cancel", response_id: current });
      clearPlayback();
    };
    $("thinking").onchange = $("speak").onchange = () => {
      if (ready) settings();
    };
    $("setVoice").onclick = async () => {
      if (!ready) {
        status("Start a conversation first.");
        return;
      }
      const file = $("voice").files[0];
      if (file)
        send({
          type: "frankie.voice.update",
          wav: base64(new Uint8Array(await file.arrayBuffer())),
          transcript: $("voiceText").value || undefined,
        });
    };
    $("send").onclick = async () => {
      if (active) {
        status("Interrupt the current response first.");
        return;
      }
      const text = $("text").value.trim(),
        image = $("image").files[0],
        content = [];
      if (text) content.push({ type: "input_text", text });
      if (image)
        content.push({
          type: "input_image",
          image_url: `data:${image.type};base64,${base64(new Uint8Array(await image.arrayBuffer()))}`,
        });
      if (!content.length) return;
      pendingText = true;
      send({
        type: "conversation.item.create",
        item: { type: "message", role: "user", content },
      });
      $("text").value = "";
      $("image").value = "";
    };
  </script>
</html>
